[project]
name = "ghidra-mcp-lite"
dynamic = ["version"]
description = "Lightweight native Ghidra MCP server — no ChromaDB, no ML/embedding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.2.1",
    "mcp[cli]>=2.3,<3",
    "pydantic>=2",
    "jpype1>=1.5.2",
    "pyghidra>=3.1",
]

[project.optional-dependencies]
# Call graphs (gen_callgraph) and PDB/symbol-server setup during analysis.
ghidrecomp = ["ghidrecomp>=0.5.8"]
dev = ["pytest>=8"]

[project.scripts]
ghidra-mcp = "ghidra_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ghidra_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a Ghidra 12.1+ install (set GHIDRA_INSTALL_DIR)",
    "gui: launches the Ghidra GUI; needs a display and GHIDRA_MCP_GUI_TESTS=1",
]
